<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lock In">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>November Lock In</title>
<style>
/* ── Design tokens ─────────────────────────────────────────────── */
:root{
  --bg:#101216;--surface:#181C23;--raised:#202631;--raised-hi:#262D3B;
  --ink:#F4F5F7;--mut:#929AA8;
  --blue:#7AAEFF;--violet:#A58BFF;--on:#101216;
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.16);
  --tint:rgba(122,174,255,.14);--tint-line:rgba(122,174,255,.40);
  --grad:linear-gradient(135deg,var(--blue),var(--violet));
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --gap:16px;--pad:18px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)
}

/* ── Base ──────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 12% -4%,rgba(122,174,255,.10),transparent 70%),radial-gradient(52% 40% at 100% 100%,rgba(165,139,255,.08),transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(104px + env(safe-area-inset-bottom,0px))}
.v{display:none}
.v.on{display:flex;flex-direction:column;gap:var(--gap);min-width:0}

/* ── Type ──────────────────────────────────────────────────────── */
h1{margin:4px 0 0;font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:500;color:var(--mut)}
.sec{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--ink)}
.msg{margin:0;max-width:44ch;font-size:14px;color:var(--mut)}
.rating{font-size:13px;color:var(--mut);text-align:center}
.lk{margin:12px 0 0;font-size:13px;color:var(--mut)}
.ex{font-size:13px;color:var(--mut)}
.lb{display:block;margin:14px 0 6px;font-size:13px;color:var(--mut)}

/* ── Surfaces ──────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad)}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hdr+.msg{margin-top:-6px}
.dayb{flex:none;margin-top:2px;padding:6px 12px;border:1px solid var(--line-hi);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.head .big{font-size:22px;font-weight:600;color:var(--blue)}
.head .big small,.big small{font-size:13px;font-weight:400;color:var(--mut)}
#inst{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:var(--gap);padding:12px 14px}
#inst .btn{margin:0}#inst .rating{text-align:left}
#inst .x{background:none;border:0;padding:0 4px;color:var(--mut);font-size:20px;cursor:pointer}

/* ── Hero: 30-day dial ─────────────────────────────────────────── */
.hero{background:radial-gradient(90% 70% at 20% 0%,rgba(122,174,255,.10),transparent 70%),var(--surface);position:relative;overflow:hidden}
.hero .sec{margin-bottom:10px}
.hero-body{display:flex;align-items:center;gap:20px}
.dial{position:relative;flex:none;width:152px}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.dial::after{content:"";position:absolute;inset:7%;border:1px solid var(--violet);border-radius:50%;opacity:0;pointer-events:none}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial-c b{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.03em}
.dial-c span{margin-top:4px;font-size:11px;color:var(--mut)}
.rg-bg,.rg-fg{fill:none;stroke-width:6}
.rg-bg{stroke:rgba(255,255,255,.07)}
.rg-fg{stroke:url(#rg-grad);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:var(--off,101);transition:stroke-dashoffset .9s var(--ease)}
.tk{stroke:rgba(255,255,255,.14);stroke-width:2;stroke-linecap:round;transition:stroke .4s,opacity .4s}
.tk.m{stroke:rgba(255,255,255,.30)}
.tk.p{stroke:var(--blue);opacity:var(--o)}
.tk.f{stroke:var(--violet)}
.tk.t{stroke-width:3}.tk.t.m{stroke:var(--ink)}
.hero-side{flex:1;min-width:0}
.stats{display:grid;gap:14px}
.stats b{display:block;font-size:26px;font-weight:300;line-height:1.1}
.stats span{display:block;margin-top:3px;font-size:12px;color:var(--mut)}
.hero .rating{margin-top:14px;text-align:left}

/* ── Progress bars & charts ────────────────────────────────────── */
.bar{height:6px;margin:0;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar i{display:block;width:0;height:100%;background:var(--grad);border-radius:inherit;transition:width .8s var(--ease)}
.head+.bar{margin-bottom:16px}
.tg{margin:14px 0}.tg:first-child{margin-top:0}.tg:last-child{margin-bottom:0}
.tg .l{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:14px}
.tg .l span:last-child{color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:3px;height:96px}
.chart i{flex:1;min-height:2px;background:linear-gradient(0deg,var(--blue),var(--violet));border-radius:3px 3px 0 0}
.axis{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--mut)}
.tt{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr .8fr;gap:6px;align-items:center;margin-bottom:8px;font-size:13px}
.tt>*{min-width:0}.tt input{padding:10px 2px;text-align:center;border-radius:var(--r-sm)}
.hd{font-size:11px;line-height:1.3;color:var(--mut);text-align:center}
.dl{text-align:center;font-size:13px;font-weight:600;color:var(--blue)}

/* ── Habit tiles ───────────────────────────────────────────────── */
.pc{margin-bottom:8px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);transition:border-color .25s var(--ease),background-color .25s var(--ease),transform .2s var(--ease)}
.pc:has(.item.on){border-color:var(--tint-line);background:linear-gradient(135deg,rgba(122,174,255,.10),rgba(165,139,255,.08)),#202631}
.pc:has(.item:active){transform:scale(.985)}
.item{display:flex;gap:14px;align-items:center;width:100%;min-height:64px;padding:12px 16px;text-align:left;background:none;border:0;border-radius:var(--r-md);color:var(--ink);cursor:pointer}
.item.dd{margin-top:8px;background:var(--raised);border:1px solid var(--line);transition:border-color .25s var(--ease),transform .2s var(--ease)}
.item.dd.on{border-color:var(--tint-line)}
.item.dd:active{transform:scale(.985)}
.t{min-width:0}
.t b{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.08em}
.t span{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.item.on .t{opacity:.62}
.item.on .t b{text-decoration:line-through;text-decoration-thickness:1px}
.ic{flex:none;width:16px;height:16px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box{position:relative;flex:none;display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line-hi);border-radius:9px;font-size:0;color:transparent;transition:background-color .2s,border-color .2s}
.item.on .box{border-color:transparent;background:var(--grad)}
.item.on .box::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:12px;margin:-8px 0 0 -3.5px;border:solid var(--on);border-width:0 2.5px 2.5px 0;border-radius:1px;transform:rotate(45deg)}
.item.pop .box{animation:boxpop .34s var(--ease)}
.item.pop .box::after{animation:checkin .3s .08s var(--ease) both}
.ck{display:flex;align-items:center;gap:14px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;flex:none;display:grid;place-items:center;width:24px;height:24px;margin:0;border:1.5px solid var(--line-hi);border-radius:8px;background:transparent;cursor:pointer;transition:background-color .2s,border-color .2s}
.ck input:checked{border-color:transparent;background:var(--grad)}
.ck input:checked::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ck input:disabled{opacity:.5;cursor:default}

/* ── Calendar ──────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#vC>.card:first-child{padding-left:12px;padding-right:12px}
.wd{padding-bottom:2px;font-size:11px;font-weight:500;color:var(--mut);text-align:center}
.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);background:color-mix(in srgb,var(--blue) calc(var(--s)*11%),var(--surface));color:var(--ink);font-size:14px;font-weight:500;line-height:1.1;cursor:pointer;transition:transform .15s var(--ease)}
.day small{font-size:10px;font-weight:400;color:var(--mut)}
.day:active{transform:scale(.94)}
.day.fut{opacity:.4;background:var(--surface)}
.day.miss{border-style:dashed;border-color:var(--line-hi)}
.day.part{border-color:rgba(122,174,255,.35)}
.day.full{border-color:transparent;background:var(--grad);color:var(--on);font-weight:600}.day.full small{color:rgba(16,18,22,.72)}
.day.today{border-color:var(--blue)}.day.full.today{border-color:transparent}
.day.today::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.day.full.today::after{background:var(--on)}
.day.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--violet);animation:cellin .28s var(--ease)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;font-size:11px;color:var(--mut)}

/* ── Navigation ────────────────────────────────────────────────── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(16,18,22,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{position:relative;flex:1;max-width:96px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--mut);font-size:11px;font-weight:500;cursor:pointer;transition:color .25s var(--ease)}
.tabs button::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .35s var(--ease)}
.tabs button.on{color:var(--blue)}.tabs button.on::before{transform:none}
.tabs svg{width:24px;height:24px;transition:transform .25s var(--ease)}
.tabs button:active svg{transform:scale(.9)}
.sub{display:flex;gap:8px;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--mut);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.sub button.on{border-color:var(--tint-line);background:var(--tint);color:var(--blue)}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.nv b{font-size:15px;font-weight:600}
.nv button{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--raised);font-size:20px;line-height:1;cursor:pointer;transition:background-color .2s,transform .15s var(--ease)}
.nv button:active{transform:scale(.92)}

/* ── Forms & buttons ───────────────────────────────────────────── */
textarea,input[type=number],input[type=text]{width:100%;padding:12px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:84px;margin-top:10px;resize:vertical}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.nums>*{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:10px 8px 0 0;padding:0 16px;background:var(--raised);color:var(--ink);border:1px solid var(--line-hi);border-radius:var(--r-md);font-size:14px;font-weight:500;cursor:pointer;transition:background-color .2s,border-color .2s,transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
#fgo,#ib{border-color:transparent;background:var(--blue);color:var(--on);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{min-height:46px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg);font-size:14px;cursor:pointer;transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),transform .15s var(--ease)}
.qa button:active{transform:scale(.97)}
.qa button.on{border-color:var(--tint-line);background:var(--tint);color:var(--blue)}
.qa button:disabled{opacity:.5}

/* ── Disclosure ────────────────────────────────────────────────── */
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:7px;height:7px;margin-left:auto;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-2px);transition:transform .25s var(--ease)}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.gd{margin:0 0 8px;font-size:13px}.card>details.gd{margin:12px 0 0}.xr .gd{margin:6px 0 0}
.gd summary{display:flex;align-items:center;min-height:40px;color:var(--blue);cursor:pointer}
.gp{margin:8px 0;color:var(--mut);line-height:1.55}.gp b{color:var(--ink);font-weight:600}
.xr{padding:12px 0;border-top:1px solid var(--line)}
.xr b{display:block;font-size:14px;font-weight:600}
.xr .ex{display:block;margin:2px 0 8px}
#fc summary{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer}
#fsum{font-weight:500;color:var(--blue)}
.ft{margin:10px 0 18px;font-size:56px;font-weight:300;letter-spacing:.02em;text-align:center}

/* ── Toast ─────────────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;max-width:calc(100vw - 32px);padding:11px 18px;overflow:hidden;background:var(--raised);color:var(--ink);border:1px solid var(--line-hi);border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;text-overflow:ellipsis;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Focus ring ────────────────────────────────────────────────── */
button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--tint-line);box-shadow:0 0 0 3px rgba(122,174,255,.18)}
.ck input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;box-shadow:none}
@media (hover:hover){
  .pc:hover,.item.dd:hover{border-color:var(--line-hi)}
  .btn:hover,.nv button:hover{border-color:var(--tint-line);background:var(--raised-hi)}
  #fgo:hover,#ib:hover{background:#8FBAFF}
  .sub button:hover:not(.on),.tabs button:hover:not(.on){color:var(--ink)}
  .day:hover{border-color:var(--line-hi)}
}

/* ── Motion ────────────────────────────────────────────────────── */
/* Entrance runs only when a view is opened (JS adds .enter); taps never replay it. */
.v.enter>*:not(.sub){animation:rise .6s var(--ease) both}
.v.enter>:nth-child(2){animation-delay:.05s}.v.enter>:nth-child(3){animation-delay:.10s}
.v.enter>:nth-child(4){animation-delay:.15s}.v.enter>:nth-child(5){animation-delay:.20s}
.v.enter>:nth-child(6){animation-delay:.25s}.v.enter>:nth-child(n+7){animation-delay:.30s}
.v.enter .bar i{animation:growx .9s .15s var(--ease) both;transform-origin:left}
.v.enter .chart i{animation:growy .7s .15s var(--ease) both;transform-origin:bottom}
.v.enter .rg-fg{animation:ringin 1.1s .25s var(--ease) both}
.v.enter .tk{animation:tickin .5s var(--ease) both;animation-delay:calc(.15s + var(--i)*16ms)}
.hero.cele .dial::after{animation:pulse 1.1s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes ringin{from{stroke-dashoffset:101}}
@keyframes tickin{from{opacity:0}}
@keyframes boxpop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes checkin{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@keyframes cellin{from{transform:scale(.92)}}
@keyframes pulse{0%{opacity:.7;transform:scale(.92)}100%{opacity:0;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width:380px){
  :root{--pad:16px}
  h1{font-size:25px}
  .dial{width:140px}.dial-c b{font-size:36px}
  .hero-body{gap:16px}
}
@media (min-width:900px){
  main{max-width:1080px;padding:40px 40px calc(120px + env(safe-area-inset-bottom,0px))}
  h1{font-size:34px}
  .hero-body{flex-direction:column;gap:0}
  .dial{width:min(100%,260px)}.dial-c b{font-size:64px}.dial-c span{margin-top:6px;font-size:12px}
  .hero-side{width:100%}
  .stats{grid-template-columns:1fr 1fr;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .stats>div{text-align:center}.stats>div+div{border-left:1px solid var(--line)}
  .stats b{font-size:24px}
  .hero .rating{margin-top:12px;text-align:center}
  .sub{margin:0;padding:0}
  #vH.on{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--gap) 24px;align-items:start}
  #vH>.hdr,#vH>.msg{grid-column:1/-1}
  #vH>.hero{grid-column:1;grid-row:3}
  #vH>#fc{grid-column:1;grid-row:4}
  #vH>.tc{grid-column:2;grid-row:3/span 2}
  #vC.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
  #vA.on{width:100%;max-width:720px;margin:0 auto}
  #vP.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
  #vP>#test{grid-column:1/-1}
  .tabs{left:50%;right:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:6px 8px;border:1px solid var(--line-hi);border-radius:999px;transform:translateX(-50%)}
  .tabs button{flex:none;width:96px}
  .tabs button::before{top:-1px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<main>
  <div class="card" id="inst" hidden></div>

  <section class="v" id="vH">
    <div class="hdr"><div><div class="eyebrow" id="dt"></div><h1>November Lock In</h1></div><div class="dayb" id="dayb"></div></div>
    <p class="msg" id="msg"></p>
    <div class="card hero" id="hero">
      <p class="sec">Сарын явц</p>
      <div class="hero-body">
        <div class="dial">
          <svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">
            <defs><linearGradient id="rg-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--blue)"/><stop offset="1" style="stop-color:var(--violet)"/></linearGradient></defs>
            <g id="ticks"></g>
            <circle class="rg-bg" cx="120" cy="120" r="88"/>
            <circle class="rg-fg" id="ring" cx="120" cy="120" r="88" pathLength="100" transform="rotate(-90 120 120)"/>
          </svg>

  $('jap').innerHTML = nv() + '<p class="sec">Japanese · ' + (x.jp || 0) + ' / 60 мин</p>' + JN.map(function (n, i) { return chk(n + ' · 15 мин', 'data-j', i, jm[i] >= 15); }).join('') +
    dt('jo', 'Сурсан зүйлээ бүртгэх (заавал биш)', '<label class="lb" for="jg">Судалсан дүрэм</label><textarea class="dd" id="jg"></textarea><label class="lb" for="jv">Шинэ үг, kanji</label><textarea class="dd" id="jv"></textarea>') +
    '<div style="margin-top:12px"></div>' + bar('Сарын нийт (цаг)', Math.round(jt / 6) / 10, 30) + WK.map(function (w, i) { return row('Week ' + (i + 1) + ' · Nov ' + w[0] + '–' + w[1], Math.round(sumWk(w[0], w[1], 'jp') / 6) / 10 + ' цаг'); }).join('') +
    dt('a2', 'Гарын авлага', guide(2));
  wire('jap');
  $('jap').querySelectorAll('[data-j]').forEach(function (e) {
    e.onchange = function () {
      var y = day(sel), o = y.jp || 0, i = +e.dataset.j; y.jm = y.jm || dist(o);
      if (e.checked) { if (y.jm[i] < 15) y.jm[i] = 15; } else y.jm[i] = 0;
      y.jp = y.jm.reduce(add, 0); auto(2, o, y.jp, 60); save(); render();
    };
  });
  bind('jg', function () { return x.jg; }, function (v) { day(sel).jg = v; });
  bind('jv', function () { return x.jv; }, function (v) { day(sel).jv = v; });
  lk('jap', '.dd');
}

function reading() {
  var x = S[sel] || {}, rt = 0, b = S.bk || {}, on = done(sel).indexOf(5) > -1;
  for (var d = 1; d <= 30; d++) rt += (S[d] && S[d].pg) || 0;
  var pr = b.tot ? Math.min(100, Math.round((b.cur || 0) / b.tot * 100)) : 0;
  function bk(k, v) { S.bk = S.bk || { t: '', tot: 0, cur: 0 }; S.bk[k] = v; }
  $('rd').innerHTML = nv() + '<p class="sec">Reading</p>' + dBtn(5, on, 'Өнөөдрийн унших дууссан', '10+ хуудас') +
    '<label class="lb" for="rpg">Өнөөдөр уншсан хуудас</label><input class="dd" type="number" inputmode="numeric" min="0" id="rpg"><div style="margin-top:12px"></div>' +
    bar('Сарын хуудас', rt, 300, rt + ' / 300+') +
    dt('rb', 'Ном, тэмдэглэл (заавал биш)', '<label class="lb" for="bt">Номын нэр</label><input type="text" id="bt"><div class="nums"><div><label class="lb" for="btot">Нийт хуудас</label><input type="number" inputmode="numeric" min="0" id="btot"></div><div><label class="lb" for="bcur">Одоогийн хуудас</label><input type="number" inputmode="numeric" min="0" id="bcur"></div></div>' + bar('Номын явц', b.cur || 0, b.tot || 0, pr + '%') + '<label class="lb" for="rn">Нэг чухал санаа</label><textarea class="dd" id="rn"></textarea>') +
    dt('a5', 'Гарын авлага', guide(5));
  wire('rd'); wireItems('rd', sel);
  bind('bt', function () { return b.t; }, function (v) { bk('t', v.slice(0, 200)); });
  bind('btot', function () { return b.tot; }, function (v) { bk('tot', v); }, 1);
  bind('bcur', function () { return b.cur; }, function (v) { bk('cur', v); }, 1);
  bind('rpg', function () { return x.pg; }, function (v) { var y = day(sel), o = y.pg || 0; y.pg = v; auto(5, o, v, 10); }, 1);
  bind('rn', function () { return x.rn; }, function (v) { day(sel).rn = v; });
  lk('rd', '.dd');
}

function analytics() {
  var q = 0;
  for (var d = 1; d <= cur; d++) if (sc(d) >= 4) q++;
  $('an').innerHTML = '<p class="sec">Долоо хоног тус бүр</p>' + WK.map(function (w, i) { var t = 0; for (var e = w[0]; e <= w[1]; e++) t += sc(e); return bar('Week ' + (i + 1), t, (w[1] - w[0] + 1) * 5); }).join('') +
    '<p class="sec" style="margin-top:14px">Pillar-уудын харьцуулалт</p>' + pbars() + bar('Тогтвортой байдал (≥4/5)', q, Math.max(cur, 1), q + ' / ' + cur + ' өдөр');
}

function applyBackup(t) {
  try {
    var o = JSON.parse(t);
    if (!o || typeof o !== 'object' || Array.isArray(o)) throw 0;
    if (+o.v > SV) { alert('Backup шинэ хувилбарынх байна — app-аа шинэчил'); return; }
    var c = clean(o), days = Object.keys(c).filter(function (k) { return /^\d+$/.test(k); }),
      shaped = days.some(function (k) { return Array.isArray(o[k] && o[k].done); });
    if (o.app !== KEY && !shaped) throw 0;
    if (!confirm('Backup: ' + days.length + ' өдрийн өгөгдөл. Одоогийн өгөгдлийг солих уу? (Өмнөх өгөгдлийн нөөц хадгалагдана)')) return;
    try { localStorage.setItem(KEY + '-prev', JSON.stringify(S)); } catch (e) {}
    S = c; save(); render(); toast('Сэргээлээ ✓');
  } catch (e) { alert('Backup буруу эсвэл хоосон байна'); }
}
function bkd() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function bkj() { return JSON.stringify(Object.assign({ app: KEY, saved: bkd() }, S)); }
function rvShow() { var h = true; try { h = !localStorage.getItem(KEY + '-prev'); } catch (e) {} $('rv').hidden = h; }
$('rv').onclick = function () {
  var q; try { q = localStorage.getItem(KEY + '-prev'); } catch (e) {}
  if (!q || !confirm('Restore-оос өмнөх өгөгдөл рүү буцах уу?')) return;
  try { S = clean(JSON.parse(q)); } catch (e) { alert('Нөөц эвдэрсэн байна'); return; }
  save(); render(); toast('Буцаалаа ✓');
};
$('bk').onclick = function () { copy(bkj(), $('bk')); };
$('dl').onclick = function () {
  try {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bkj()], { type: 'application/json' }));
    a.download = 'lockin-backup-' + bkd() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500); toast('Backup файл татлаа ✓');
  } catch (e) { copy(bkj(), $('bk')); }
};
$('rfb').onclick = function () { $('rf').click(); };
$('rf').onchange = function () {
  var f = this.files[0]; this.value = '';
  if (!f) return;
  if (f.size > 1e6) { alert('Файл хэт том байна'); return; }
  var r = new FileReader(); r.onload = function () { applyBackup(String(r.result)); }; r.readAsText(f);
};
$('rs').onclick = function () { var t = prompt('Backup-аа энд paste хий'); if (t) applyBackup(t); };

function vib() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
var tt = 0;
function toast(m) { var t = $('toast'); t.textContent = m; t.className = 'toast on'; clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, 1900); }
var tx = 0, ty = 0;
document.addEventListener('touchstart', function (e) { var t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
document.addEventListener('touchend', function (e) {
  if (tab === 0 || tab > 2 || (e.target.closest && e.target.closest('textarea,input,.chart,.tabs,.sub'))) return;
  var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) { sel = Math.min(30, Math.max(1, sel + (dx < 0 ? 1 : -1))); render(); }
}, { passive: true });
var dp = null, IK = 'lockin-inst-x';
function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function showInst(h) {
  var dismissed = false; try { dismissed = localStorage.getItem(IK) === '1'; } catch (e) {}
  if (standalone() || dismissed) return;
  $('inst').innerHTML = h + '<button class="x" id="ix" aria-label="Хаах">✕</button>';
  $('inst').hidden = false;
  $('ix').onclick = function () { $('inst').hidden = true; try { localStorage.setItem(IK, '1'); } catch (e) {} };
}
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); dp = e;
  showInst('<button class="btn" id="ib">📲 App болгон суулгах</button>');
  var b = $('ib'); if (b) b.onclick = function () { dp.prompt(); dp.userChoice.then(function () { $('inst').hidden = true; dp = null; }); };
});
window.addEventListener('appinstalled', function () { $('inst').hidden = true; });
if (/iphone|ipad|ipod/i.test(navigator.userAgent)) showInst('<div class="rating">iPhone: <b>Safari</b>-аар нээгээд Share ⬆️ → <b>Add to Home Screen</b>. Суулгахаасаа өмнө Backup хий.</div>');
document.addEventListener('visibilitychange', function () { if (!document.hidden) { reload(); render(); } });
window.addEventListener('storage', function (e) { if (e.key === KEY && reload()) render(); });
var NAV = [['Нүүр', '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'], ['Календарь', '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'], ['Үйлдэл', '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'], ['Ахиц', '<path d="M5 20v-7M11 20V5M17 20v-10M3 20h18"/>']];
$('nav').innerHTML = NAV.map(function (n) { return '<button aria-label="' + n[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + n[1] + '</svg><span>' + n[0] + '</span></button>'; }).join('');
$('sub').innerHTML = SUB.map(function (n) { return '<button>' + n + '</button>'; }).join('');
$('sub').querySelectorAll('button').forEach(function (b, i) { b.onclick = function () { sub = i; render(); }; });
var FK = KEY + '-focus', F = { m: 'idle', tot: 1500, end: 0, left: 0 }, ft = 0;
try {
  var fs = JSON.parse(localStorage.getItem(FK) || 'null');
  if (fs && [1500, 3000, 3600].indexOf(fs.tot) > -1 && ['idle', 'run', 'pause', 'done'].indexOf(fs.m) > -1) F = { m: fs.m, tot: fs.tot, end: +fs.end || 0, left: +fs.left || 0 };
} catch (e) {}
function fsave() { try { localStorage.setItem(FK, JSON.stringify(F)); } catch (e) {} }
function fmt(n) { return pad(Math.floor(n / 60)) + ':' + pad(n % 60); }
function fleft() { return F.m === 'run' ? Math.max(0, Math.ceil((F.end - Date.now()) / 1000)) : F.m === 'pause' ? Math.ceil(F.left / 1000) : F.tot; }
function fshow() {
  var l = fleft(), on = F.m === 'run' || F.m === 'pause';
  if (F.m === 'run' && l <= 0) { F.m = 'done'; on = false; fsave(); vib(); toast('Focus дууслаа ✓'); }
  if (F.m === 'run') { if (!ft) ft = setInterval(fshow, 500); } else { clearInterval(ft); ft = 0; }
  $('ft').textContent = F.m === 'done' ? 'Дууслаа ✓' : fmt(l);
  $('fsum').textContent = on ? '· ' + fmt(l) : '';
  $('fgo').textContent = F.m === 'run' ? 'Түр зогсоох' : F.m === 'pause' ? 'Үргэлжлүүлэх' : 'Эхлэх';
  $('ffin').hidden = !on;
  document.querySelectorAll('#fp button').forEach(function (b) { b.className = +b.dataset.m * 60 === F.tot ? 'on' : ''; b.disabled = on; });
}
$('fgo').onclick = function () {
  if (F.m === 'run') { F.left = Math.max(0, F.end - Date.now()); F.m = 'pause'; }
  else { F.end = Date.now() + (F.m === 'pause' ? F.left : F.tot * 1000); F.m = 'run'; }
  fsave(); fshow();
};
$('ffin').onclick = function () { F.m = 'idle'; fsave(); fshow(); };
document.querySelectorAll('#fp button').forEach(function (b) { b.onclick = function () { F.tot = +b.dataset.m * 60; F.m = 'idle'; fsave(); fshow(); }; });
document.addEventListener('visibilitychange', function () { if (!document.hidden) fshow(); });
render(); fshow();
if (BAD) setTimeout(function () { alert('Хадгалсан өгөгдөл эвдэрсэн байсан тул нөөцөлсөн. Шинээр эхэллээ.'); }, 300);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
